name: Nightly Release

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional base version; normalized to MAJOR.MINOR.PATCH-nightly.RUN_NUMBER'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: velopack-nightly-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate nightly source
    uses: ./.github/workflows/validation.yml
    permissions:
      contents: read

  publish:
    name: Package and publish nightly release
    needs: validate
    if: github.event_name == 'schedule' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Velopack CLI
        shell: pwsh
        run: dotnet tool install --global vpk --version 1.2.0

      - name: Normalize nightly version
        id: version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $sourceVersion = $env:REQUESTED_VERSION
          if ([string]::IsNullOrWhiteSpace($sourceVersion)) {
              $props = [xml](Get-Content -LiteralPath 'Directory.Build.props')
              $sourceVersion = [string]$props.Project.PropertyGroup.Version
          }

          if ($sourceVersion -notmatch '^\s*v?(?<base>\d+\.\d+\.\d+)(?:\.\d+)?(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?\s*$') {
              throw "Nightly version source '$sourceVersion' must contain a semantic MAJOR.MINOR.PATCH version."
          }

          $version = "$($Matches.base)-nightly.$env:GITHUB_RUN_NUMBER"
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Packaging nightly channel at version '$version'."

      - name: Build Velopack release
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: .\Publish-Velopack.ps1 -Configuration Release -Runtime win-x64 -Channel nightly -Version $env:RELEASE_VERSION

      - name: Replace nightly release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem -LiteralPath 'artifacts/velopack/releases' -File | ForEach-Object FullName
          if (-not $files) {
              throw 'No Velopack release files were produced.'
          }

          gh release view nightly 2>$null
          if ($LASTEXITCODE -eq 0) {
              $oldAssets = gh release view nightly --json assets --jq '.assets[].name'
              if ($LASTEXITCODE -ne 0) { throw 'Failed to list existing nightly release assets.' }

              foreach ($asset in $oldAssets) {
                  gh release delete-asset nightly $asset --yes
                  if ($LASTEXITCODE -ne 0) { throw "Failed to delete nightly asset '$asset'." }
              }

              gh release upload nightly $files --clobber
              if ($LASTEXITCODE -ne 0) { throw 'Failed to upload nightly release assets.' }

              gh release edit nightly --title 'Skua Nightly' --prerelease
              if ($LASTEXITCODE -ne 0) { throw 'Failed to update the nightly release.' }
          }
          else {
              gh release create nightly $files --title 'Skua Nightly' --prerelease --target $env:GITHUB_SHA
              if ($LASTEXITCODE -ne 0) { throw 'Failed to create the nightly release.' }
          }
