name: Validation

on:
  workflow_call:
    inputs:
      build-release:
        description: 'Build the Release configuration during validation.'
        required: false
        type: boolean
        default: true
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore solution
        shell: pwsh
        run: dotnet restore .\Skua.sln -m --nologo

      - name: Build Debug
        shell: pwsh
        run: dotnet build .\Skua.sln -c Debug -m --no-restore --nologo

      - name: Build Release
        if: ${{ inputs.build-release }}
        shell: pwsh
        run: dotnet build .\Skua.sln -c Release -m --no-restore --nologo
