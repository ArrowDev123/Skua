name: Validation

on:
  workflow_call:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore solution
        shell: pwsh
        run: dotnet restore .\Skua.sln -m:1 --nologo

      - name: Build Debug
        shell: pwsh
        run: dotnet build .\Skua.sln -c Debug -m:1 --no-restore --nologo

      - name: Build Release
        shell: pwsh
        run: dotnet build .\Skua.sln -c Release -m:1 --no-restore --nologo
