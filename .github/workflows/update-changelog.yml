name: Update Changelog

on:
  release:
    types:
      - published
      - edited
      - deleted

permissions:
  contents: write

jobs:
  update:
    name: Regenerate changelog
    if: github.event.release.prerelease != true
    runs-on: ubuntu-latest

    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Generate changelog
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const releases = await github.paginate(
              github.rest.repos.listReleases,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 }
            );
            const published = releases
              .filter(release => !release.draft && !release.prerelease)
              .sort((left, right) => new Date(right.published_at || 0) - new Date(left.published_at || 0));
            const markdown = published.map(release => {
              const date = release.published_at
                ? new Date(release.published_at).toLocaleDateString('en-US', { month: 'long', day: '2-digit', year: 'numeric' })
                : 'Unknown date';
              return '# ' + (release.name || release.tag_name) + '\n' +
                '## Released: ' + date + '\n\n' +
                (release.body || 'No release notes provided.') + '\n\n---\n\n';
            }).join('');
            fs.writeFileSync('changelogs.md', markdown, 'utf8');

      - name: Commit changelog
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          branch: ${{ github.event.repository.default_branch }}
          file_pattern: changelogs.md
          commit_message: 'docs: update changelog [skip ci]'
